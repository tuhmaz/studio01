name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PASSWORD: postgres
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (tenant isolation, RLS, authorization)
        run: npm run test:integration

      # Mitarbeiter-App: Typprüfung und Tests der Offline-Logik (Postausgang).
      - name: Install mobile dependencies
        run: npm ci --prefix mobile --ignore-scripts

      - name: Mobile typecheck
        run: npx tsc --noEmit -p mobile

      - name: Mobile tests (offline outbox)
        run: npm run test:mobile

      - name: Build
        run: npm run build
        env:
          # Build-time only: the app reads real values from .env at runtime.
          JWT_SECRET: ci-build-only-secret-not-used-at-runtime-000
